# Publishes the Hirebound static page (projects/agent-jobs/web) to GitHub Pages.
name: pages
on:
  push:
    branches: [master]
    paths: ["projects/agent-jobs/web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: projects/agent-jobs/web }
      - id: d
        uses: actions/deploy-pages@v4
